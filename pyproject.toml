[project]
name = "minitransformer"
version = "0.1.0"
description = "Transformer encoder, decoder and encoder-decoder models implemented from scratch in PyTorch, trained on text classification and summarization, plus T5 fine-tuning for translation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "El-Mehdi Boulaalam" }]
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
train = [
    "transformers>=4.53",
    "datasets>=3.0",
    "evaluate",
    "sacrebleu",
    "rouge-score",
    "accelerate",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "pandas",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minitransformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
